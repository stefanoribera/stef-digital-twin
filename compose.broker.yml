services:
  stef-redis:
    image: redis:7.2-alpine
    container_name: stef-redis
    restart: unless-stopped
    env_file: .env
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "noeviction"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
    networks:
      - stef_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 2s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: '768M'

networks:
  stef_net:
    external: true
