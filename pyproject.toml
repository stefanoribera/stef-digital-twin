[project]
name = "stef-digital-twin-core"
version = "1.0.0"
description = "EOSC Digital Twin Infrastructure"
requires-python = "~=3.14.0"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
# Tier-0 Gateway: Needs the async broker, server, and ADBC Arrow streaming logic.
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "redis>=5.2.0",
    "adbc-driver-postgresql>=1.0.0",
    "pyarrow>=17.0.0",
]
# Tier-2 Compute: Needs the async queue, math engine, and high-throughput transactional DB writer.
compute = [
    "polars>=1.20.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "redis>=5.2.0",
]
# Tier-4 Presentation: Needs HTTP client, visualization, and Polars/Arrow for zero-copy parsing.
ui = [
    "streamlit>=1.40.0",
    "httpx>=0.28.1",
    "polars>=1.20.0",
    "pyarrow>=17.0.0",
    "plotly>=5.20.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]