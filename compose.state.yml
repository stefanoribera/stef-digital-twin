services:
  stef-db:
    image: pgvector/pgvector:pg18
    container_name: stef-db
    restart: unless-stopped
    env_file: .env
    environment:
      - PGDATA=/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT_EXT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - stef_net
    command:
      - "postgres"
      - "-c"
      - "synchronous_commit=on"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_connections=50"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: '6G'

volumes:
  pgdata:

networks:
  stef_net:
    external: true
